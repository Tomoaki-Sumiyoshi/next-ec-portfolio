openapi: 3.0.3
info:
  title: next-ec-portfolio API
  version: 0.1.0
servers:
  - url: http://localhost:3000
    description: Local web/API origin
paths:
  /api/products:
    get:
      operationId: listProducts
      summary: List products
      description: Returns all products. When ids is specified, returns products whose id is included in the list.
      tags:
        - Products
      parameters:
        - name: ids
          in: query
          required: false
          description: Comma-separated product IDs to filter by.
          schema:
            type: array
            items:
              type: string
              minLength: 1
          style: form
          explode: false
          example: p001,p002
      responses:
        '200':
          description: Product list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /api/products/{productId}:
    get:
      operationId: getProductById
      summary: Get product by ID
      tags:
        - Products
      parameters:
        - name: productId
          in: path
          required: true
          description: Product ID.
          schema:
            type: string
            minLength: 1
          example: p001
      responses:
        '200':
          description: Product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product was not found.
          content:
            text/plain:
              schema:
                type: string
              example: product not found
  /api/health:
    get:
      operationId: getHealth
      summary: Check API health
      tags:
        - Health
      responses:
        '200':
          description: API is available.
  /api/health/db:
    get:
      operationId: getDatabaseHealth
      summary: Check database health
      tags:
        - Health
      responses:
        '200':
          description: Database connection is available.
        '503':
          description: Database connection is unavailable.
          content:
            text/plain:
              schema:
                type: string
              example: db unavailable
components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
        - imageUrl
        - description
      properties:
        id:
          type: string
          minLength: 1
          example: p001
        name:
          type: string
          minLength: 1
          example: Wireless Mouse
        price:
          type: integer
          format: int64
          minimum: 0
          example: 2980
        imageUrl:
          type: string
          minLength: 1
          example: https://placehold.co/600x400?text=Mouse
        description:
          type: string
          example: Lightweight wireless mouse.
