openapi: 3.0.3
info:
  title: next-ec-portfolio API
  version: 0.1.0
servers:
  - url: http://localhost:3000
    description: Local web/API origin
paths:
  /api/products:
    get:
      operationId: listProducts
      summary: List products
      description: Returns all products. When ids is specified, returns products whose id is included in the list.
      tags:
        - Products
      parameters:
        - name: ids
          in: query
          required: false
          description: Comma-separated product IDs to filter by.
          schema:
            type: array
            items:
              type: string
              minLength: 1
          style: form
          explode: false
          example: p001,p002
      responses:
        '200':
          description: Product list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /api/orders:
    get:
      operationId: listOrders
      summary: List orders for a user
      description: Returns orders associated with the specified user ID.
      tags:
        - Orders
      parameters:
        - name: userId
          in: query
          required: true
          description: User ID used to filter orders.
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-42d3-a456-426614174000
      responses:
        '200':
          description: Order list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          description: Invalid user ID.
    post:
      operationId: createOrder
      summary: Create an order
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order request.
  /api/orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get an order by ID
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          description: Order ID.
          schema:
            type: string
            format: uuid
          example: 987fcdeb-51a2-43d7-9012-3456789abcde
      responses:
        '200':
          description: Order details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order ID.
        '404':
          description: Order not found.
  /api/health:
    get:
      operationId: getHealth
      summary: Check API health
      tags:
        - Health
      responses:
        '200':
          description: API is available.
  /api/health/db:
    get:
      operationId: getDatabaseHealth
      summary: Check database health
      tags:
        - Health
      responses:
        '200':
          description: Database connection is available.
        '503':
          description: Database connection is unavailable.
          content:
            text/plain:
              schema:
                type: string
              example: db unavailable
components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
        - imageUrl
        - description
      properties:
        id:
          type: string
          minLength: 1
          example: p001
        name:
          type: string
          minLength: 1
          example: Wireless Mouse
        price:
          type: integer
          format: int64
          minimum: 0
          example: 2980
        imageUrl:
          type: string
          minLength: 1
          example: https://placehold.co/600x400?text=Mouse
        description:
          type: string
          example: Lightweight wireless mouse.
    OrderItem:
      type: object
      required:
        - productId
        - quantity
        - marketPrice
      properties:
        productId:
          type: string
          minLength: 1
          example: p001
        quantity:
          type: integer
          minimum: 1
          example: 2
        marketPrice:
          type: integer
          format: int64
          minimum: 0
          example: 2980
    OrderCustomer:
      type: object
      required:
        - fullName
        - email
      properties:
        fullName:
          type: string
          minLength: 2
          example: Taro Yamada
        email:
          type: string
          format: email
          example: taro@example.com
    OrderAddress:
      type: object
      required:
        - postCode
        - addressLine1
      properties:
        postCode:
          type: string
          pattern: '^[0-9]{3}-[0-9]{4}$'
          example: 100-0001
        addressLine1:
          type: string
          example: 1-1 Chiyoda, Chiyoda-ku, Tokyo
        addressLine2:
          type: string
          example: Example Building 101
    CreateOrderRequest:
      type: object
      required:
        - userId
        - itemList
        - customer
        - shippingAddress
      properties:
        userId:
          type: string
          format: uuid
          example: 123e4567-e89b-42d3-a456-426614174000
        itemList:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        customer:
          $ref: '#/components/schemas/OrderCustomer'
        shippingAddress:
          $ref: '#/components/schemas/OrderAddress'
    Order:
      allOf:
        - $ref: '#/components/schemas/CreateOrderRequest'
        - type: object
          required:
            - id
            - createdAt
          properties:
            id:
              type: string
              format: uuid
              example: 987fcdeb-51a2-43d7-9012-3456789abcde
            createdAt:
              type: string
              format: date-time
              example: '2026-07-19T12:34:56.000Z'
