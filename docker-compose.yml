services:
  db:
    image: postgres:16
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: app_local
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./infra/db/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
